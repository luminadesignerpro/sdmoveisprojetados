<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Móveis Projetados de Alta Qualidade" />
  <meta name="author" content="SD Móveis" />
  <meta property="og:title" content="SD Móveis Projetados" />
  <meta property="og:description" content="Transformando sonhos em ambientes projetados." />

  <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-180x180.png" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script>
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      alert("Error: " + message + " at " + source + ":" + lineno + ":" + colno);
      return true;
    };
    window.addEventListener("unhandledrejection", function(event) {
      alert("Unhandled promise rejection: " + (event.reason && event.reason.message ? event.reason.message : event.reason));
    });
  </script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Registra o Service Worker (roda depois da limpeza de cache acima, no evento "load")
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
          console.warn('Falha ao registrar o Service Worker:', err);
        });
      });
    }
  </script>
</body>
</html>
